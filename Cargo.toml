[package]
name = "bevy-jam-8"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# Only needed if you use `rand` (rand 0.10 pairs with getrandom 0.4).
# Skip these lines if you don't.
# rand = "0.10"
# [target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom = { version = "0.4", features = ["wasm_js"] }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Small wasm builds
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.wasm-release]
inherits = "release"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
